# Brightfield IHC: myosin (DAB) + actin (AP Red) + hematoxylin, RGB images
name: Myosin / actin IHC
pixel_size_um: 0.5
mode: bright
stains: [hema, dab, apred]
groups:
  Wild-type: "*WT*"
  c-sub mutant: "*MUT*"
